<div class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold">Dashboard</h2>
        <p class="text-secondary mb-0">
            Welcome back! Here's your checklist overview.
        </p>
    </div>

    <div class="row g-4">

        <!-- Total Lists -->

        <div class="col-xl-4 col-md-6">

            <div class="dashboard-card bg-primary">

                <div class="card-icon">
                    <i class="bi bi-card-checklist"></i>
                </div>

                <div>
                    <small>Total Lists</small>

                    <h2>
                        {{ dashboard().totalLists }}
                    </h2>

                    <span>
                        All available lists
                    </span>
                </div>

            </div>

        </div>

        <!-- My Lists -->

        <div class="col-xl-4 col-md-6">

            <div class="dashboard-card bg-success">

                <div class="card-icon">
                    <i class="bi bi-person-check-fill"></i>
                </div>

                <div>
                    <small>Created By Me</small>

                    <h2>
                        {{ dashboard().myLists }}
                    </h2>

                    <span>
                        Lists created by you
                    </span>
                </div>

            </div>

        </div>

        <!-- Other Lists -->

        <div class="col-xl-4 col-md-6">

            <div class="dashboard-card bg-warning">

                <div class="card-icon">
                    <i class="bi bi-people-fill"></i>
                </div>

                <div>
                    <small>Created By Others</small>

                    <h2>
                        {{ dashboard().otherLists }}
                    </h2>

                    <span>
                        Shared lists
                    </span>
                </div>

            </div>

        </div>

    </div>

</div>
