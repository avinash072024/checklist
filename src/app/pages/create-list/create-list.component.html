<div class="container">
    <div class="row">
        <div class="col-md-5 mx-auto">
            @if(stepOne){
            <div class="card border-2 rounded-4 shadow mb-4">
                <div class="card-header">
                    Create List
                </div>

                <div class="card-body">
                    <div class="input-group">
                        <input type="text" class="form-control" appCapitalizeFirst placeholder="Enter list name"
                            [(ngModel)]="listName">

                        <button class="btn btn-primary" (click)="enableStepTwo()">
                            <i class="bi bi-arrow-right-circle"></i> Next
                        </button>
                    </div>
                </div>
            </div>

            } @else if (stepTwo) {

            <!-- Add Item -->
            <div class="card border-2 rounded-4 shadow mb-4">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <p class="mb-0">{{listName}}</p>
                        <!-- <p class="mb-0">{{listItems.length}}</p> -->
                        <span class="badge text-bg-primary">{{listItems.length}}</span>
                    </div>
                </div>

                <div class="card-body">

                    <div class="input-group">
                        <input type="text" class="form-control" #itemInputBox appCapitalizeFirst
                            placeholder="Enter Item" [(ngModel)]="newItemName" name="newItem">

                        <button class="btn btn-primary" (click)="addListItem()">
                            <i class="bi bi-plus-circle"></i> Add
                        </button>
                    </div>

                </div>
            </div>

            <!-- List -->
            @for(item of listItems; track item.id){

            <div class="card rounded-4 shadow mb-3 border-0 border-start border-end border-5"
                [ngClass]="item.isCheck ? 'border-success' : 'border-danger'">

                <div class="card-body p-3">

                    <!-- @if(editingId === item.id){

                    <div class="input-group input-group-custom">

                        <input appCapitalizeFirst class="form-control" [(ngModel)]="editItemName"
                            name="edit{{item.id}}">

                        <div class="ms-2 d-flex gap-2">
                            <button class="btn btn-success btn-sm" (click)="updateItem()">
                                <i class="bi bi-check-lg"></i>
                            </button>

                            <button class="btn btn-danger btn-sm" (click)="cancelEdit()">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>

                    </div>

                    } @else { -->

                    <div class="d-flex justify-content-between align-items-center">

                        <div class="form-check">
                            <input class="form-check-input fs-5" type="checkbox" [id]="'item'+item.id"
                                [checked]="item.isCheck" (change)="updateStatus(item, $event)">

                            <label class="form-check-label fs-5" [for]="'item'+item.id"
                                [ngClass]="item.isCheck ? 'text-decoration-line-through' : ''">
                                {{ item.text }}
                            </label>
                        </div>

                        <div class="d-flex gap-2">

                            <!-- <button class="btn btn-success btn-sm" (click)="startEdit(item)">
                                <i class="bi bi-pencil-square"></i>
                            </button> -->

                            <button class="btn btn-danger btn-sm" (click)="deleteItem(item.id)">
                                <i class="bi bi-trash3"></i>
                            </button>

                        </div>

                    </div>

                    <!-- } -->

                </div>

            </div>

            }



            @if (!listItems.length) {
            <div class="card border-2 rounded-4 shadow mb-3">
                <div class="card-body text-center p-3">
                    <p class="mb-0">No item added. Please add</p>
                </div>
            </div>
            } @else {
            <!-- <div class="d-flex justify-content-between align-items-center">
                <span class="badge text-bg-primary mb-0">Total items: {{listItems.length}}</span>
                <span class="badge text-bg-success mb-0">Completed items: {{listItems.length}}</span>
                <span class="badge text-bg-warning mb-0">Pending items: {{listItems.length}}</span>
            </div> -->
            <div class="d-flex justify-content-center align-items-center mt-5">
                <button type="button" class="btn btn-primary" (click)="updateChecklist()"><i class="bi bi-check-lg"></i> Done</button>
            </div>
            }
            }
        </div>
    </div>
</div>
