<div class="container">
    <div class="row">
        <div class="col-md-5 mx-auto">
            @if(stepOne){
            <div class="card border-2 rounded-4 shadow mb-4">
                <div class="card-header">
                    Create List
                </div>

                <div class="card-body">
                    <div class="input-group">
                        <input type="text" class="form-control" appCapitalizeFirst placeholder="Enter list name"
                            [(ngModel)]="listName">

                        <button class="btn btn-primary" (click)="enableStepTwo()">
                            <i class="bi bi-arrow-right-circle"></i> Next
                        </button>
                    </div>
                </div>
            </div>

            } @else if (stepTwo) {

            <!-- Add Item -->
            <div class="card border-2 rounded-4 shadow mb-4">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <p class="mb-0">{{listName}}</p>
                        <!-- <p class="mb-0">{{listItems.length}}</p> -->
                        <span class="badge text-bg-primary">{{listItems.length}}</span>
                    </div>
                </div>

                <div class="card-body">

                    <div class="input-group">
                        <input type="text" class="form-control" #itemInputBox appCapitalizeFirst
                            placeholder="Enter Item" [(ngModel)]="newItemName" name="newItem">

                        <button class="btn btn-primary" (click)="addListItem()">
                            <i class="bi bi-plus-circle"></i> Add
                        </button>
                    </div>

                </div>
            </div>

            <!-- @for (item of listItems; track $index) {
            <div class="card border-2 rounded-4 shadow mb-2 border-0 border-5 border-start border-end"
                [ngClass]="item?.completed ? 'border-success' : 'border-danger'">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" [value]="item?._id" [id]="item?._id"
                            [checked]="item?.completed">
                        <label class="form-check-label" [for]="item?._id">
                            {{item.text}}
                        </label>
                    </div>
                    <button type="button" class="btn btn-danger btn-sm" (click)="deleteItem(item?._id)"><i
                            class="bi bi-trash3"></i></button>
                </div>
            </div>
            } -->

            @if (listItems.length) {
            <div class="card rounded-4 overflow-hidden">
                <ul class="list-group list-group-flush">
                    @for (item of listItems; track $index) {
                    <li class="list-group-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <p class="mb-0">{{item.text}}</p>
                            <button type="button" class="btn btn-danger btn-sm" (click)="deleteItem(item?._id)"><i
                                    class="bi bi-trash3"></i></button>
                        </div>
                    </li>
                    }
                </ul>
            </div>
            }

            @if (!listItems.length) {
            <div class="card border-2 rounded-4 shadow mb-3">
                <div class="card-body text-center p-3">
                    <p class="mb-0">No item added. Please add item</p>
                </div>
            </div>
            } @else {
            <div class="text-center mt-4">
                <a routerLink="/dashboard" class="btn btn-primary text-decoration-none"><i class="bi bi-check-lg"></i>
                    Done</a>
            </div>
            }
            }
        </div>
    </div>
</div>
