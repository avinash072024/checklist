<section class="user-list-section mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-1">Users</h4>
            <p class="text-muted mb-0">Overview of users, their checklist counts, and joining dates.</p>
        </div>
    </div>

    <div *ngIf="isLoading()" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="!isLoading() && users().length === 0" class="alert alert-light border text-center py-4">
        No users found.
    </div>

    <div class="row mt-3">
        <div class="col-md-12">
            <div class="card rounded-4 shadow h-100">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover table-striped mb-0">
                            <thead>
                                <tr>
                                    <th style="min-width: 10rem;">Full&nbsp;Name</th>
                                    <th class="text-center">Joined&nbsp;Date</th>
                                    <th class="text-center">Checklist&nbsp;Count</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let user of users()">
                                    <!-- <td style="min-width: 10rem;">{{ user?.fullname || user?.firstName + ' ' + user?.lastName || 'Unknown User' }}
                                    </td> -->
                                    <td>
                                        <div style="min-width: 10rem;" class="fw-medium text-dark d-flex align-items-center"
                                            [title]="user?.fullname || 'Anonymous'" style="min-width: 170px;">
                                            <img [src]="avatarService.getAvatar(user?.fullname)" class="me-2" />
                                            <span class="mb-0">{{ user?.fullname ||
                                                'Anonymous' }}</span>
                                        </div>
                                    </td>
                                    <td class="text-center">{{ user?.joinedDate ? (user.joinedDate | date:'mediumDate') : 'N/A' }}</td>
                                    <td class="text-center">{{ user?.totalChecklist ?? 0 }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
