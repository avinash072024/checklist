<div class="card border-0 rounded-5 shadow p-4 text-center mx-auto">
    <div class="card-body py-4">
        <!-- Modern Icon Placeholder (using Bootstrap Icons) -->
        <div class="mb-3">
            <div class="d-inline-flex align-items-center justify-content-center text-primary rounded-circle"
                style="width: 64px; height: 64px; box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;">
                <i class="bi bi-journal-plus fs-3"></i>
            </div>
        </div>

        <!-- Heading -->
        <h5 class="fw-bold text-dark mb-2">Checklist Not Found</h5>

        <!-- Description -->
        <p class="text-muted small mb-4">
            The checklist you are looking for is not found. It may have been deleted or the link you followed is incorrect.
        </p>

        <!-- Action Button -->
        <button (click)="location.back()"
            class="btn btn-primary rounded-pill px-4 py-2 fw-semibold text-decoration-none shadow-sm">
            <i class="bi bi-arrow-left me-1"></i> Back
        </button>
    </div>
</div>
