<div class="header-actions d-flex align-items-center gap-2">

    <!-- Theme Switcher -->
    <div class="theme-switcher-wrapper position-relative" [class]="dynamicClass">
        <app-theme-switcher></app-theme-switcher>
    </div>

    <!-- User Dropdown -->
    <div class="dropdown user-dropdown me-2 me-md-2 me-lg-0" [class]="dynamicClass">

        <!-- User Button -->
        <button type="button" class="user-menu-btn dropdown-toggle d-flex align-items-center" data-bs-toggle="dropdown"
            aria-expanded="false" aria-label="Open user menu">

            <!-- Avatar -->
            <span class="user-avatar">
                <i class="bi bi-person-fill"></i>
            </span>

            <!-- Desktop User Name -->
            <span class="user-info d-none d-lg-flex flex-column">
                <span class="user-name">
                    {{ displayName }}
                </span>

                <span class="user-label">
                    Manage your Account
                </span>
            </span>

            <!-- Dropdown Icon -->
            <i class="bi bi-chevron-down dropdown-icon d-none d-lg-block"></i>
        </button>

        <!-- Dropdown Menu -->
        <ul class="dropdown-menu dropdown-menu-end user-dropdown-menu rounded-5 shadow-lg">

            <!-- User Header -->
            <li class="user-dropdown-header">
                <div class="d-flex align-items-center gap-3">

                    <div class="user-avatar user-avatar-lg">
                        <!-- <i class="bi bi-person-fill"></i> -->
                        <!-- <img [src]="avatarService.getAvatar(displayName)" [alt]="displayName || 'User avatar'"
                            class="user-avatar" /> -->
                        <img [src]="`https://ui-avatars.com/api/?name=${displayName}&background=4361EE&color=ffffff&rounded=true&size=40`" alt="">
                    </div>

                    <div class="user-details">
                        <div class="user-details-label">
                            Logged in as
                        </div>
                        <div class="user-details-name">
                            {{ displayName }}
                        </div>

                        <!-- <div class="user-details-label">
                            Manage your account
                        </div> -->
                    </div>

                </div>
            </li>

            <li>
                <hr class="dropdown-divider">
            </li>

            <!-- Profile -->
            <li>
                <a class="dropdown-item user-dropdown-item" routerLink="/my-profile">

                    <span class="menu-icon">
                        <i class="bi bi-person-circle position-relative top-2px"></i>
                    </span>

                    <span class="menu-content">
                        <span class="menu-title">
                            My Profile
                        </span>

                        <span class="menu-description">
                            View and update your profile
                        </span>
                    </span>

                    <i class="bi bi-chevron-right menu-arrow"></i>
                </a>
            </li>

            <!-- Change Password -->
            <li>
                <a class="dropdown-item user-dropdown-item" routerLink="/change-password">

                    <span class="menu-icon">
                        <i class="bi bi-key-fill position-relative top-2px"></i>
                    </span>

                    <span class="menu-content">
                        <span class="menu-title">
                            Change Password
                        </span>

                        <span class="menu-description">
                            Update your account password
                        </span>
                    </span>

                    <i class="bi bi-chevron-right menu-arrow"></i>
                </a>
            </li>

            <li>
                <hr class="dropdown-divider">
            </li>

            <!-- Logout -->
            <li>
                <button type="button" class="dropdown-item user-dropdown-item logout-item" data-bs-toggle="modal" data-bs-target="#LogoutStaticBackdrop">

                    <span class="menu-icon">
                        <i class="bi bi-box-arrow-right position-relative top-2px"></i>
                    </span>

                    <span class="menu-content">
                        <span class="menu-title">
                            Logout
                        </span>

                        <span class="menu-description">
                            Sign out of your account
                        </span>
                    </span>

                    <i class="bi bi-chevron-right menu-arrow"></i>
                </button>
            </li>

        </ul>
    </div>

</div>
