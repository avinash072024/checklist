<button type="button" class="btn btn-primary" [title]="currentTheme === 'dark' ? 'Light' : 'Dark'" (click)="toggleTheme();">
    @if(currentTheme === 'light'){
        <i class="bi bi-moon-stars-fill"></i>
    } @else {
        <i class="bi bi-sun-fill"></i>
    }
</button>
