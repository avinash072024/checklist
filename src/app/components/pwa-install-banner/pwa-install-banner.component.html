<div class="pwa-overlay" *ngIf="showBanner" @slideUp>
    <div class="pwa-card">
        <div class="app-icon-container">
            <!-- Replace with your app logo path -->
            <img src="../public/fav-icon.png" alt="App Logo" class="app-icon" />
            <span class="pulse-ring"></span>
        </div>

        <div class="pwa-content">
            <h3>Install Our App</h3>
            <p>Get a faster, full-screen experience with offline access.</p>
        </div>

        <div class="pwa-actions">
            <button class="btn-install" (click)="install()">
                <svg class="icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"
                    fill="none">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Install
            </button>
            <button class="btn-close" (click)="dismiss()" aria-label="Close">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
</div>
