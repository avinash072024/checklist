<nav class="navbar fixed-top navbar-expand-lg shadow bg-primary">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="dashboard">
      <div class="brand-icon-wrapper">
        <i class="bi bi-check2-square position-relative top-3px"></i>
      </div>
      <span class="brand-text fw-bold">{{appName}}</span>
    </a>

    <div class="d-flex align-items-center">
      <app-user-dropdown [dynamicClass]="'d-block d-md-block d-lg-none mx-2'"></app-user-dropdown>
      <div class="d-block d-md-block d-lg-none">
        <button type="button" class="btn btn-primary btn-sm pb-0" data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
          aria-label="Toggle navigation">
          <i class="bi bi-grid-fill fs-4"></i>
        </button>
      </div>
    </div>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mx-auto my-2 my-lg-0 text-center text-lg-start">
        @for (item of navLinks; track $index) {
        <li class="nav-item my-1 my-lg-0 mx-lg-1">
          <a class="nav-link px-3 py-2 rounded-pill" [routerLink]="item?.path" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: item?.path === '/dashboard'}" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent">
            {{item?.label}}
          </a>
        </li>
        }
      </ul>
      <app-user-dropdown [dynamicClass]="'d-none d-md-none d-lg-block'"></app-user-dropdown>
    </div>
  </div>
</nav>
